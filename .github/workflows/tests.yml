name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # The tests run on synthetic data, so the SDWPF download is not needed; CPU-only PyTorch keeps it small.
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pandas pyarrow scikit-learn matplotlib torch-geometric pytest
      - name: Run tests
        run: python -m pytest -q
